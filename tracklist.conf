limit_req_zone $binary_remote_addr zone=tracklist_limit:10m rate=20r/s;
limit_req_status 429;

server {
    listen 80;
    listen [::]:80;
    server_name 129.151.217.58.nip.io;
    return 301 https://$server_name$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name 129.151.217.58.nip.io;

    ssl_certificate /etc/letsencrypt/live/129.151.217.58.nip.io/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/129.151.217.58.nip.io/privkey.pem;

    client_max_body_size 1M;

    location / {
        limit_req zone=tracklist_limit burst=40 nodelay;

        proxy_pass http://localhost:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
