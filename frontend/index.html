<!DOCTYPE html>
<html lang="ru" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>TrackList Mini App</title>
    <!-- Telegram WebApp SDK -->
    <script src="https://telegram.org/js/telegram-web-app.js?v=2"></script>
    <script>
      (function() {
        var isViewportBound = false;
        function activateFullscreen() {
          var twa = window.Telegram && window.Telegram.WebApp;
          if (!twa) return;
          try {
            if (typeof twa.ready === 'function') {
              twa.ready();
            }
            if (typeof twa.expand === 'function') {
              twa.expand();
            }
            if (typeof twa.requestFullscreen === 'function' && !twa.isFullscreen) {
              twa.requestFullscreen();
            }
            if (typeof twa.disableVerticalSwipes === 'function') {
              twa.disableVerticalSwipes();
            }
            if (!isViewportBound && typeof twa.onEvent === 'function') {
              twa.onEvent('viewportChanged', activateFullscreen);
              isViewportBound = true;
            }
          } catch (e) {
            console.warn('activateFullscreen error:', e);
          }
        }

        // 1. Instant execution
        activateFullscreen();

        // 2. Cascade retry timers for Desktop IPC bridge delay
        [50, 150, 300, 600, 1000, 1500, 2500].forEach(function(ms) {
          setTimeout(activateFullscreen, ms);
        });

        // 3. User gesture fallback (click / touch / pointer)
        ['click', 'touchstart', 'pointerdown'].forEach(function(evt) {
          window.addEventListener(evt, activateFullscreen, { once: true, passive: true });
        });
      })();
    </script>
  </head>
  <body class="bg-[#0B0D14] text-white min-h-screen w-full max-w-full overflow-x-hidden relative antialiased selection:bg-purple-500 selection:text-white">
    <div id="root" class="w-full max-w-full overflow-x-hidden"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
